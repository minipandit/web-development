<!DOCTYPE html>
<html>
    <head>
        <title>lesson-8-homework</title>
        <link rel="stylesheet" href="lesson-8-homework.css">
    </head>

    <body>
        <input class="text-box-1" type="text" placeholder="Name">

        <input class="text-box-2" type="text" placeholder="Email">

        <p class="survey-text">
            Thanks for chatting with our customer support. Would you like to take our quick survey?
        </p>

        <button class="yes-button">Yes</button>

        <button class="no-button">No</button>

        <div>
            <img class="google-logo" src="Google-Logo.png" alt="">

            <input type="text" class="search-bar" placeholder="Search Google or type a URL">

            <button class="search-button">Google Search</button>

            <button class="lucky-button">I'm Feeling Lucky</button>
        </div>

        <input class="name-box" type="text" placeholder="First Name">

        <input class="name-box-1" type="text" placeholder="First Name">

        <input class="email-box" type="text" placeholder="Email">

        <button class="sign-up-button">Sign Up</button>

        <p class="uber-text">
            Request a ride now
        </p>

        <input class="pickup-box" type="text" placeholder="Enter pickup location">

        <input class="destination-box" type="text" placeholder="Enter destination">

        <button class="request-button">Request now</button>

        <button class="schedule-button">Schedule for later</button>
    </body>
</html>
